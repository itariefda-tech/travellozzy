server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name travelozy.my.id www.travelozy.my.id;

    root /var/www/travelozy/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/travelozy.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelozy.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name travelozy.my.id www.travelozy.my.id;
    return 301 https://$host$request_uri;
}
